name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The e2e suites need a real herdr, omp and SEORI_E2E_OMP=1, or hc and SEORI_E2E_HC=1; without them they skip.
      - run: bun test ./test/ --timeout 60000

  e2e-hc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install hc 0.1.20
        run: |
          # The release host can answer 5xx for a while: three tries with a backoff, then fail.
          for attempt in 1 2 3; do
            curl -fsSL https://releases.herdr.dev/core/install.sh | HC_VERSION=0.1.20 sh && break
            [ "$attempt" = 3 ] && exit 22
            sleep $((attempt * 20))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hc update --version 0.1.20
      - run: hc --version
      # Each file starts its own isolated core (HC_SESSION + temp XDG dirs) with a fake omp and stops it at the end.
      - name: hc e2e
        env:
          SEORI_E2E_HC: "1"
        run: bun test test/e2e-hc.test.ts test/e2e-hc-cli.test.ts test/e2e-migrate.test.ts --timeout 120000
